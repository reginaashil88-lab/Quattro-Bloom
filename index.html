<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About - QUATTRO BLOOM</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* FIX BACKGROUND: Ukuran baik, benar, dan proporsional */
    body {
      margin: 0;
      background: linear-gradient(to top, rgba(19, 78, 137, 0.85), rgba(5, 19, 29, 0.95)), 
                  url('bg_powerpuff-girls.jpeg') no-repeat center center fixed;
      background-size: contain; 
      background-color: #05131d; 
    }

    /* FIX LOGO & NAV MENU: Membuat logo kecil dan rapi seperti ikon website */
    .nav-menu {
      position: absolute;
      top: 20px;
      left: 30px;
      display: flex;
      align-items: center; /* Membuat logo dan teks sejajar secara vertikal */
      gap: 20px;
      z-index: 1000;
    }

    .nav-menu img {
      height: 35px; /* Mengubah ukuran logo menjadi seukuran ikon navigasi standar */
      width: auto;
      object-fit: contain; /* Menjaga logo tidak gepeng atau pecah */
      filter: drop-shadow(0px 2px 4px rgba(0, 0, 0, 0.5)); /* Efek bayangan halus pada logo */
      transition: transform 0.2s ease;
    }

    .nav-menu img:hover {
      transform: scale(1.1); /* Sedikit membesar saat didekati kursor */
    }

    .nav-menu a {
      color: white;
      text-decoration: none;
      font-weight: bold;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .nav-menu a:hover {
      color: #e6e82a;
    }

    /* 1. Styling untuk memperbesar, merapikan nama, dan menambah animasi foto */
    .photo-grid {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 25px; 
      margin-bottom: 40px;
    }

    .photo-card {
      text-align: center;
      width: 130px; 
      transition: transform 0.3s ease; 
    }

    .photo-card:hover {
      transform: scale(1.12) rotate(3deg); 
    }

    .photo-card img {
      width: 130px;  
      height: 130px; 
      object-fit: cover; 
      border-radius: 50%; 
      border: 4px solid #ec1cce; 
      box-shadow: 0 6px 12px rgba(0,0,0,0.4);
    }

    .photo-card p {
      font-size: 0.8rem; 
      margin: 12px 0 0 0; 
      font-weight: bold;
      color: white;
      text-transform: uppercase;
      text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.8); 
      letter-spacing: 0.5px;
    }

    /* 2. Styling untuk Embed Canva seukuran layar full */
    .full-screen-canva {
      width: 100vw; 
      position: relative;
      margin-left: -50vw; 
      left: 50%;
    }

    .canva-embed-holder {
      position: relative;
      width: 100%;
      height: 0;
      padding-top: 56.25%; 
      overflow: hidden;
      will-change: transform;
    }

    .canva-embed-holder iframe {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      border: none;
      padding: 0;
      margin: 0;
    }

    .canva-caption {
      text-align: center;
      background: rgba(0, 0, 0, 0.7);
      padding: 15px;
      margin: 0;
      font-size: 0.9rem;
    }

    .canva-caption a {
      color: #e6e82a;
      text-decoration: none;
      font-weight: bold;
    }

    .top-content {
      padding-top: 80px; 
    }
  </style>
</head>
