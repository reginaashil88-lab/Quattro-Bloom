<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloom | Word Scramble Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="logo">Bloom.</a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="design.html">Design</a></li>
            <li><a href="product.html">Product</a></li>
            <li><a href="about.html">About Us</a></li>
        </ul>
    </nav>

    <div class="container">
        <h1>Word Scramble</h1>
        <p>Uji wawasan informatikamu dengan menyusun kembali huruf-huruf acak di bawah ini menjadi istilah yang tepat!</p>

        <div class="game-box">
            <div id="scrambled-word">...</div>
            <p id="hint" style="font-style: italic; font-size: 15px; color: #777;">Petunjuk permainan akan muncul di sini</p>
        </div>

        <input type="text" id="user-guess" placeholder="Ketik susunan kata di sini...">
        <br>
        <button class="btn" onclick="checkAnswer()">Periksa Jawaban</button>
        <button class="btn" onclick="initGame()" style="background: var(--pink-blossom); color: var(--deep-cherry);">Ganti Kata</button>
        
        <p id="message" style="margin-top: 25px; font-weight: bold; font-size: 20px;"></p>
    </div>

    <script>
        const words = [
            { word: "DATABASE", scramble: "TEBASADA", hint: "Sistem penyimpanan data digital yang terstruktur." },
            { word: "NETWORK", scramble: "KROWTEN", hint: "Jaringan koneksi antar perangkat komputer." },
            { word: "PYTHON", scramble: "NOHYTP", hint: "Salah satu bahasa pemrograman populer bersimbol ular." },
            { word: "SECURITY", scramble: "YTIRECES", hint: "Aspek keamanan pada sistem atau data komputer." },
            { word: "BROWSER", scramble: "WESBROR", hint: "Perangkat lunak yang digunakan untuk menjelajahi website." }
        ];

        let currentWord = {};

        function initGame() {
            const randomIndex = Math.floor(Math.random() * words.length);
            currentWord = words[randomIndex];
            document.getElementById("scrambled-word").innerText = currentWord.scramble;
            document.getElementById("hint").innerText = "Petunjuk: " + currentWord.hint;
            document.getElementById("message").innerText = "";
            document.getElementById("user-guess").value = "";
        }

        function checkAnswer() {
            const userGuess = document.getElementById("user-guess").value.trim().toUpperCase();
            const message = document.getElementById("message");
            
            if (userGuess === currentWord.word) {
                message.style.color = "#27ae60";
                message.innerText = "🌸 Hebat! Jawabanmu Benar.";
            } else if (userGuess === "") {
                message.style.color = "#e67e22";
                message.innerText = "Masukkan jawaban terlebih dahulu!";
            } else {
                message.style.color = "#c0392b";
                message.innerText = "❌ Masih Kurang Tepat, Silakan Coba Lagi.";
            }
        }

        window.onload = initGame;
    </script>
</body>
</html>
